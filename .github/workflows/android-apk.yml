name: Compiler l’APK Android

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Préparer Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Vérifier les paramètres OwpenGram
        env:
          EXPO_PUBLIC_OWPENGRAM_API_ID: ${{ secrets.EXPO_PUBLIC_OWPENGRAM_API_ID }}
          EXPO_PUBLIC_OWPENGRAM_API_HASH: ${{ secrets.EXPO_PUBLIC_OWPENGRAM_API_HASH }}
        run: node scripts/ci-check-owpengram-env.cjs

      - name: Préparer Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Construire le protocole et vérifier le projet
        run: |
          npm run build:protocol
          npm test

      - name: Préparer le SDK Android
        shell: bash
        run: |
          # Keep the sdkmanager exit status; yes normally exits on SIGPIPE.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006' \
            'cmake;3.22.1' \
            'cmake;3.30.5'

      - name: Générer le projet natif Expo SDK 55
        run: >-
          npx expo prebuild --platform android --clean --no-install
          --template expo-template-bare-minimum@55.0.44

      - name: Compiler un APK autonome signé pour les tests
        working-directory: android
        env:
          NODE_ENV: production
          EXPO_PUBLIC_OWPENGRAM_API_ID: ${{ secrets.EXPO_PUBLIC_OWPENGRAM_API_ID }}
          EXPO_PUBLIC_OWPENGRAM_API_HASH: ${{ secrets.EXPO_PUBLIC_OWPENGRAM_API_HASH }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Vérifier et préparer le fichier installable
        run: |
          node scripts/ci-verify-apk.cjs android/app/build/outputs/apk/release/app-release.apk android/app/debug.keystore
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/BearLike-OwpenGram-test.apk
          sha256sum artifacts/BearLike-OwpenGram-test.apk

      - name: Rendre l’APK téléchargeable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BearLike-OwpenGram-test.apk
          path: artifacts/BearLike-OwpenGram-test.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
